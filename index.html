<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Myself</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/myself.css">
</head>
<body class="page-guest">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <p class="brand-kicker">слушайте дома</p>
        <h1>Myself</h1>
      </div>
    </div>
  </header>

  <main class="layout">
    <div class="catalog-head">
      <h2 class="section-title">Каталог</h2>
      <p class="muted">Нажмите на трек, чтобы включить его</p>
    </div>
    <div id="track-list" class="track-list" aria-live="polite">
        <div class="empty">Загрузка треков...</div>
    </div>
    <p id="list-error" class="message message-error" hidden></p>
  </main>
  
  <footer class="player-bar">
    <audio id="audio" preload="metadata"></audio>

    <div class="now" id="now" role="button" tabindex="0" aria-label="Открыть на весь экран" title="Открыть на весь экран">
      <div class="cover now-cover" id="now-cover" aria-hidden="true"></div>
      <div class="now-meta">
        <p id="now-title">Ничего не выбрано</p>
        <p id="now-artist" class="muted">Выберите трек из списка</p>
      </div>
    </div>

    <div class="transport">
      <button type="button" id="prev-btn" class="ctl-btn" disabled aria-label="Предыдущий трек">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zm3.5 7L19 5.5v13L9.5 12z"></path></svg>
      </button>
      <button type="button" id="play-btn" class="play-btn js-play" disabled aria-label="Воспроизвести">
        <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 5.5v13l11-6.5-11-6.5z"></path>
        </svg>
        <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true" hidden>
          <path d="M7 5h3.5v14H7zm6.5 0H17v14h-3.5z"></path>
        </svg>
      </button>
      <button type="button" id="next-btn" class="ctl-btn" disabled aria-label="Следующий трек">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM5 5.5 14.5 12 5 18.5v-13z"></path></svg>
      </button>
      <span id="current-time" class="time">0:00</span>
      <input id="progress" class="slider" type="range" min="0" max="100" value="0" step="0.1" disabled aria-label="Прогресс воспроизведения">
      <span id="duration" class="time">0:00</span>
    </div>

    <label class="volume">
      <svg class="icon icon-volume" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9h3.2L12 5.2v13.6L7.2 15H4V9zm11.2.8a4.2 4.2 0 0 1 0 4.4l-1.3-1a2.5 2.5 0 0 0 0-2.4l1.3-1zm2.4-2.1a7.2 7.2 0 0 1 0 8.6l-1.3-1a5.4 5.4 0 0 0 0-6.6l1.3-1z"></path>
      </svg>
      <span class="sr-only">Громкость</span>
      <input id="volume" class="slider" type="range" min="0" max="1" value="1" step="0.01" aria-label="Громкость">
    </label>
  </footer>

  <div id="fs" class="fs" hidden role="dialog" aria-modal="true" aria-label="Сейчас играет">
    <button type="button" id="fs-close" class="fs-close" aria-label="Свернуть">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"></path></svg>
    </button>
    <div class="fs-body">
      <div class="fs-cover" id="fs-cover"></div>
      <div class="fs-meta">
        <p id="fs-title" class="fs-title">Ничего не выбрано</p>
        <p id="fs-artist" class="fs-artist">Выберите трек из списка</p>
      </div>
      <div class="fs-progress-row">
        <span id="fs-current" class="time">0:00</span>
        <input id="fs-progress" class="slider" type="range" min="0" max="100" value="0" step="0.1" disabled aria-label="Прогресс воспроизведения">
        <span id="fs-duration" class="time">0:00</span>
      </div>
      <div class="fs-controls">
        <button type="button" id="fs-prev" class="ctl-btn ctl-big" disabled aria-label="Предыдущий трек">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zm3.5 7L19 5.5v13L9.5 12z"></path></svg>
        </button>
        <button type="button" id="fs-play" class="play-btn play-big js-play" disabled aria-label="Воспроизвести">
          <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5-11-6.5z"></path></svg>
          <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M7 5h3.5v14H7zm6.5 0H17v14h-3.5z"></path></svg>
        </button>
        <button type="button" id="fs-next" class="ctl-btn ctl-big" disabled aria-label="Следующий трек">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM5 5.5 14.5 12 5 18.5v-13z"></path></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Подключаем парсер тегов и сам плеер -->
  <script src="js/id3.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
